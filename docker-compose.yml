services:
  gestao-musical:
    build: .
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://host.docker.internal:32768/gestao-musical
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gestao-musical.rule=Host(`musical.controladoria.tech`)"
      - "traefik.http.routers.gestao-musical.entrypoints=web,websecure"
      - "traefik.http.routers.gestao-musical.tls=true"
      - "traefik.http.routers.gestao-musical.tls.certresolver=letsencrypt"
      - "traefik.http.services.gestao-musical.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_default"
    networks:
      - traefik_net

networks:
  traefik_net:
    external: true
    name: traefik_default
