services:
  gestao-musical:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://gestao_user:gestao_pass@mongodb:27017/gestao-musical?authSource=admin
      - PORT=3000
    command: >
      sh -c "
      apk add --no-cache git &&
      if [ ! -d /app/.git ]; then
        git clone https://github.com/controladoria-terra/gestao-musical.git /app;
      else
        cd /app && git fetch origin && git reset --hard origin/main;
      fi &&
      cd /app/client && npm install && npx vite build &&
      cd /app/server && npm install --production &&
      cd /app/server && node index.js
      "
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gestao-musical.rule=Host(`musical.controladoria.tech`)"
      - "traefik.http.routers.gestao-musical.entrypoints=web,websecure"
      - "traefik.http.routers.gestao-musical.tls=true"
      - "traefik.http.routers.gestao-musical.tls.certresolver=letsencrypt"
      - "traefik.http.services.gestao-musical.loadbalancer.server.port=3000"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=gestao_user
      - MONGO_INITDB_ROOT_PASSWORD=gestao_pass
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
